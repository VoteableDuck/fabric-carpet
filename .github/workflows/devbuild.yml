name: Build NeoForge 1.21.11 JAR

on:
  push:
    branches:
      - '1.21.11'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-1.21.11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Collect distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -print -exec cp '{}' artifact/ \;
          test -n "$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh artifact

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-carpet-1.21.11-${{ github.sha }}
          path: artifact/*.jar
          if-no-files-found: error
          retention-days: 14
