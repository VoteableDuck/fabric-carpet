name: Build NeoForge 1.21.11 JAR

on:
  push:
    branches:
      - '1.21.11'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-1.21.11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Collect distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -print -exec cp '{}' artifact/ \;
          test -n "$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh artifact

      - name: Production server JAR smoke test
        shell: bash
        run: |
          set -euo pipefail
          PROD_DIR="$RUNNER_TEMP/neoforge-prod-server"
          mkdir -p "$PROD_DIR/mods"

          curl --fail --location --retry 3 \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.11.45/neoforge-21.11.45-installer.jar" \
            --output "$PROD_DIR/neoforge-installer.jar"

          (
            cd "$PROD_DIR"
            java -jar neoforge-installer.jar --installServer
            echo 'eula=true' > eula.txt
            cp "$GITHUB_WORKSPACE"/artifact/*.jar mods/

            setsid ./run.sh nogui > production-server.log 2>&1 &
            server_pid=$!
            ready=0

            for _ in $(seq 1 180); do
              if grep -Eq 'Done \([0-9.]+s\)!|Done \(' production-server.log logs/latest.log 2>/dev/null; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [ "$ready" -eq 1 ]; then
              echo 'Production NeoForge server reached ready state.'
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            else
              if kill -0 "$server_pid" 2>/dev/null; then
                echo 'Production server stayed alive for 180 seconds but did not expose the expected ready marker.' >&2
                kill -TERM -- "-$server_pid" 2>/dev/null || true
                sleep 2
                kill -KILL -- "-$server_pid" 2>/dev/null || true
              else
                wait "$server_pid" 2>/dev/null || true
                echo 'Production server exited before ready state.' >&2
              fi
            fi

            cat production-server.log
            if [ -f logs/latest.log ]; then
              echo '===== production logs/latest.log ====='
              cat logs/latest.log
            fi

            test "$ready" -eq 1
          )

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install production NeoForge client
        shell: bash
        run: |
          set -euo pipefail
          PROD_CLIENT_DIR="$RUNNER_TEMP/neoforge-prod-client"
          mkdir -p "$PROD_CLIENT_DIR/mods"
          echo '{}' > "$PROD_CLIENT_DIR/launcher_profiles.json"

          curl --fail --location --retry 3 \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.11.45/neoforge-21.11.45-installer.jar" \
            --output "$PROD_CLIENT_DIR/neoforge-installer.jar"

          (
            cd "$PROD_CLIENT_DIR"
            java -jar neoforge-installer.jar --install-client "$PROD_CLIENT_DIR"
          )
          cp artifact/*.jar "$PROD_CLIENT_DIR/mods/"

      - name: Prepare client assets
        run: ./gradlew --no-daemon downloadAssets

      - name: Production client JAR smoke test
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python3 .github/scripts/production_client_smoke.py \
            --install-dir "$RUNNER_TEMP/neoforge-prod-client" \
            --minecraft-version 1.21.11 \
            --neoforge-version 21.11.45 \
            --assets-dir "$HOME/.gradle/caches/neoformruntime/assets" \
            --timeout 120

      - name: Development client startup smoke test
        shell: bash
        run: |
          set +e
          timeout 180s xvfb-run -a ./gradlew --no-daemon runClient --stacktrace
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "Minecraft development client remained alive for 180 seconds; treating startup smoke test as passed."
            exit 0
          fi
          exit "$status"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-carpet-1.21.11-${{ github.sha }}
          path: artifact/*.jar
          if-no-files-found: error
          retention-days: 14
