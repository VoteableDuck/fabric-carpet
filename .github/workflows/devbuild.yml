name: Build NeoForge 1.21.11 JAR

on:
  push:
    branches:
      - '1.21.11'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-1.21.11-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Collect distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            -print -exec cp '{}' artifact/ \;
          test -n "$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lh artifact

      - name: Production server JAR, fake-player, Scarpet, and movable-BE smoke test
        shell: bash
        run: |
          set -euo pipefail
          PROD_DIR="$RUNNER_TEMP/neoforge-prod-server"
          mkdir -p "$PROD_DIR/mods"

          curl --fail --location --retry 3 \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.11.45/neoforge-21.11.45-installer.jar" \
            --output "$PROD_DIR/neoforge-installer.jar"

          (
            cd "$PROD_DIR"
            java -jar neoforge-installer.jar --installServer
            echo 'eula=true' > eula.txt
            printf 'online-mode=false\nspawn-protection=0\n' > server.properties
            cp "$GITHUB_WORKSPACE"/artifact/*.jar mods/
            mkdir -p world/scripts
            cp "$GITHUB_WORKSPACE"/.github/tests/scarpet/ci_break.sc world/scripts/

            mkfifo server.stdin
            exec 3<>server.stdin
            setsid ./run.sh nogui < server.stdin > production-server.log 2>&1 &
            server_pid=$!
            ready=0
            fake_spawned=0
            fake_removed=0
            scarpet_ok=0
            movable_be_block_ok=0
            movable_be_data_ok=0

            for _ in $(seq 1 180); do
              if grep -Eq 'Done \([0-9.]+s\)!|Done \(' production-server.log logs/latest.log 2>/dev/null; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [ "$ready" -eq 1 ]; then
              echo 'Production NeoForge server reached ready state.'

              echo 'script run 424200+42' >&3
              for _ in $(seq 1 30); do
                if grep -Eq '= +424242([[:space:](]|$)' production-server.log logs/latest.log 2>/dev/null; then
                  scarpet_ok=1
                  break
                fi
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              if [ "$scarpet_ok" -eq 1 ]; then
                echo 'Production Scarpet expression executed successfully.'
              fi

              # Exercise the actual movableBlockEntities rule with a chest that
              # contains an item. Use a cleared deterministic test volume so
              # terrain cannot accidentally obstruct the piston chain.
              echo 'forceload add 0 0' >&3
              echo 'carpet movableBlockEntities true' >&3
              echo 'fill 2 99 -1 8 101 1 minecraft:air' >&3
              echo 'setblock 4 100 0 minecraft:piston[facing=east]' >&3
              echo 'setblock 5 100 0 minecraft:chest' >&3
              echo 'item replace block 5 100 0 container.0 with minecraft:diamond 3' >&3
              echo 'setblock 3 100 0 minecraft:redstone_block' >&3

              # The dedicated server drains all queued console commands in a
              # single tick. Wait until the power command itself has actually
              # executed before sending the state checks, otherwise they can run
              # before the piston's scheduled block event gets a chance to fire.
              power_processed=0
              for _ in $(seq 1 30); do
                if grep -q 'Changed the block at 3, 100, 0' production-server.log logs/latest.log 2>/dev/null; then
                  power_processed=1
                  break
                fi
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              test "$power_processed" -eq 1
              sleep 1

              # Diagnostics remain in the log even when the hard assertions
              # below fail, separating power/pushability/final-placement bugs.
              echo 'execute if block 4 100 0 minecraft:piston[extended=true] run say CARPET_PISTON_EXTENDED' >&3
              echo 'execute if block 5 100 0 minecraft:chest run say CARPET_CHEST_AT_SOURCE' >&3
              echo 'execute if block 6 100 0 minecraft:chest run say CARPET_CHEST_AT_TARGET' >&3
              echo 'execute if block 5 100 0 minecraft:moving_piston run say CARPET_MOVING_PISTON_AT_SOURCE' >&3
              echo 'execute if block 6 100 0 minecraft:moving_piston run say CARPET_MOVING_PISTON_AT_TARGET' >&3
              echo 'data get block 5 100 0' >&3
              echo 'data get block 6 100 0' >&3

              # Poll the world state, not just the log. A piston can still be a
              # moving_piston when the first check runs, so re-run the final
              # assertions until its block event has fully completed.
              for _ in $(seq 1 30); do
                echo 'execute if block 6 100 0 minecraft:chest run say CARPET_MOVABLE_BE_BLOCK_OK' >&3
                echo 'execute if items block 6 100 0 container.0 minecraft:diamond run say CARPET_MOVABLE_BE_DATA_OK' >&3
                sleep 1

                if grep -q 'CARPET_MOVABLE_BE_BLOCK_OK' production-server.log logs/latest.log 2>/dev/null; then
                  movable_be_block_ok=1
                fi
                if grep -q 'CARPET_MOVABLE_BE_DATA_OK' production-server.log logs/latest.log 2>/dev/null; then
                  movable_be_data_ok=1
                fi
                if [ "$movable_be_block_ok" -eq 1 ] && [ "$movable_be_data_ok" -eq 1 ]; then
                  echo 'Production movable block-entity piston test preserved the chest and its contents.'
                  break
                fi
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
              done

              echo 'player CarpetSmoke spawn' >&3
              for _ in $(seq 1 30); do
                if grep -Eq 'CarpetSmoke.*logged in with entity id|CarpetSmoke joined the game' production-server.log logs/latest.log 2>/dev/null; then
                  fake_spawned=1
                  break
                fi
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done

              if [ "$fake_spawned" -eq 1 ]; then
                echo 'Production fake player logged in successfully.'
                # Efficiency 100 makes attack-once break stone in one tick,
                # while a single remaining durability point detects tool loss.
                # Use actual player ticks: /script run suppresses event callbacks.
                echo 'script load ci_break' >&3
                wait_break_marker() {
                  local marker="$1"
                  for _ in $(seq 1 30); do
                    if grep -q "$marker" production-server.log logs/latest.log 2>/dev/null; then
                      return 0
                    fi
                    if grep -q 'CARPET_BREAK_FAILED' production-server.log logs/latest.log 2>/dev/null || ! kill -0 "$server_pid" 2>/dev/null; then
                      break
                    fi
                    sleep 1
                  done
                  cat production-server.log
                  return 1
                }
                for mode in survival creative; do
                  echo 'player CarpetSmoke stop' >&3
                  echo 'fill 11 100 -1 13 104 1 minecraft:air' >&3
                  echo 'setblock 12 99 0 minecraft:bedrock' >&3
                  echo "gamemode $mode CarpetSmoke" >&3
                  echo 'item replace entity CarpetSmoke weapon.mainhand with minecraft:iron_pickaxe[minecraft:damage=249,minecraft:enchantments={"minecraft:efficiency":100}]' >&3
                  echo "script in ci_break run prepare('${mode^^}')" >&3
                  echo 'tp CarpetSmoke 12.5 101 0.5 0 90' >&3
                  echo "say CARPET_BREAK_POSITIONED_${mode^^}" >&3
                  wait_break_marker "CARPET_BREAK_POSITIONED_${mode^^}"
                  # Let equipment attributes and teleport/ground state settle.
                  sleep 1
                  echo 'player CarpetSmoke attack once' >&3
                  wait_break_marker "CARPET_BREAK_ATTEMPT_${mode^^}_CANCEL"
                  echo 'script in ci_break run check_cancel()' >&3
                  wait_break_marker "CARPET_BREAK_${mode^^}_CANCEL_OK"
                  echo 'player CarpetSmoke attack once' >&3
                  wait_break_marker "CARPET_BREAK_ATTEMPT_${mode^^}_ALLOW"
                  echo 'script in ci_break run check_allow()' >&3
                  wait_break_marker "CARPET_BREAK_${mode^^}_OK"
                done
                echo 'script unload ci_break' >&3

                echo 'player CarpetSmoke jump' >&3
                sleep 1

                if ! kill -0 "$server_pid" 2>/dev/null; then
                  echo 'Production server exited while ticking the fake player.' >&2
                else
                  echo 'player CarpetSmoke kill' >&3
                  for _ in $(seq 1 30); do
                    if grep -Eq 'CarpetSmoke left the game|CarpetSmoke lost connection' production-server.log logs/latest.log 2>/dev/null; then
                      fake_removed=1
                      break
                    fi
                    if ! kill -0 "$server_pid" 2>/dev/null; then
                      break
                    fi
                    sleep 1
                  done
                fi
              fi

              if kill -0 "$server_pid" 2>/dev/null; then
                echo 'stop' >&3
                for _ in $(seq 1 30); do
                  if ! kill -0 "$server_pid" 2>/dev/null; then
                    break
                  fi
                  sleep 1
                done
              fi
            fi

            if kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$server_pid" 2>/dev/null || true
            fi
            wait "$server_pid" 2>/dev/null || true
            exec 3>&-

            cat production-server.log
            if [ -f logs/latest.log ]; then
              echo '===== production logs/latest.log ====='
              cat logs/latest.log
            fi

            test "$ready" -eq 1
            test "$scarpet_ok" -eq 1
            test "$movable_be_block_ok" -eq 1
            test "$movable_be_data_ok" -eq 1
            test "$fake_spawned" -eq 1
            test "$fake_removed" -eq 1
          )

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install production NeoForge client
        shell: bash
        run: |
          set -euo pipefail
          PROD_CLIENT_DIR="$RUNNER_TEMP/neoforge-prod-client"
          mkdir -p "$PROD_CLIENT_DIR/mods"
          echo '{}' > "$PROD_CLIENT_DIR/launcher_profiles.json"

          curl --fail --location --retry 3 \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.11.45/neoforge-21.11.45-installer.jar" \
            --output "$PROD_CLIENT_DIR/neoforge-installer.jar"

          (
            cd "$PROD_CLIENT_DIR"
            java -jar neoforge-installer.jar --install-client "$PROD_CLIENT_DIR"
          )

          # Quick Play only runs after Minecraft's first-launch UI gates. CI has
          # no user to acknowledge those screens, so mark the disposable test
          # profile as already onboarded before either production client launch.
          printf '%s\n' \
            'onboardAccessibility:false' \
            'skipMultiplayerWarning:true' \
            'joinedFirstServer:true' \
            > "$PROD_CLIENT_DIR/options.txt"

          cp artifact/*.jar "$PROD_CLIENT_DIR/mods/"

      - name: Prepare client assets
        run: ./gradlew --no-daemon downloadAssets

      - name: Production client JAR smoke test
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python3 .github/scripts/production_client_smoke.py \
            --install-dir "$RUNNER_TEMP/neoforge-prod-client" \
            --minecraft-version 1.21.11 \
            --neoforge-version 21.11.45 \
            --assets-dir "$HOME/.gradle/caches/neoformruntime/assets" \
            --timeout 120

      - name: Production Carpet client-server handshake smoke test
        shell: bash
        run: |
          set -euo pipefail
          PROD_DIR="$RUNNER_TEMP/neoforge-prod-server"
          (
            cd "$PROD_DIR"
            rm -f network.stdin network-server.log
            mkfifo network.stdin
            exec 3<>network.stdin
            setsid ./run.sh nogui < network.stdin > network-server.log 2>&1 &
            server_pid=$!
            ready=0
            joined=0
            client_status=1

            for _ in $(seq 1 180); do
              if grep -Eq 'Done \([0-9.]+s\)!|Done \(' network-server.log 2>/dev/null; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [ "$ready" -eq 1 ]; then
              set +e
              xvfb-run -a python3 "$GITHUB_WORKSPACE/.github/scripts/production_client_smoke.py" \
                --install-dir "$RUNNER_TEMP/neoforge-prod-client" \
                --minecraft-version 1.21.11 \
                --neoforge-version 21.11.45 \
                --assets-dir "$HOME/.gradle/caches/neoformruntime/assets" \
                --quick-play-multiplayer 127.0.0.1:25565 \
                --required-marker 'Joined carpet server with matching carpet version' \
                --stability-seconds 5 \
                --timeout 120
              client_status=$?
              set -e

              if grep -Eq 'Dev.*logged in with entity id|Dev joined the game' network-server.log logs/latest.log 2>/dev/null; then
                joined=1
              fi
            fi

            if kill -0 "$server_pid" 2>/dev/null; then
              echo 'stop' >&3
              for _ in $(seq 1 30); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
            fi
            if kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$server_pid" 2>/dev/null || true
            fi
            wait "$server_pid" 2>/dev/null || true
            exec 3>&-

            echo '===== production multiplayer server output ====='
            cat network-server.log
            if [ -f logs/latest.log ]; then
              echo '===== production multiplayer server logs/latest.log ====='
              cat logs/latest.log
            fi

            test "$ready" -eq 1
            test "$client_status" -eq 0
            test "$joined" -eq 1
          )

      - name: Development client startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -f development-client.log
          setsid xvfb-run -a ./gradlew --no-daemon runClient --stacktrace > development-client.log 2>&1 &
          client_pid=$!
          ready=0

          for _ in $(seq 1 180); do
            if grep -Eq 'Sound engine started|OpenAL initialized|Created: .*minecraft:textures/atlas/blocks.png-atlas' development-client.log run/logs/latest.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -eq 1 ]; then
            echo 'Minecraft development client reached renderer/audio ready state.'
          elif kill -0 "$client_pid" 2>/dev/null; then
            echo 'Minecraft development client stayed alive for 180 seconds; accepting smoke test.'
            ready=1
          else
            echo 'Minecraft development client exited before reaching ready state.' >&2
          fi

          if kill -0 "$client_pid" 2>/dev/null; then
            kill -TERM -- "-$client_pid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$client_pid" 2>/dev/null || true
          fi
          wait "$client_pid" 2>/dev/null || true

          cat development-client.log
          if [ -f run/logs/latest.log ]; then
            echo '===== development client logs/latest.log ====='
            cat run/logs/latest.log
          fi

          test "$ready" -eq 1

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-carpet-1.21.11-${{ github.sha }}
          path: artifact/*.jar
          if-no-files-found: error
          retention-days: 14
