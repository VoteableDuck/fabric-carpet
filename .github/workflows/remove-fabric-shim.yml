name: Remove bundled Fabric Loader shim

on:
  push:
    branches:
      - '1.21.11'
    paths:
      - '.github/workflows/remove-fabric-shim.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1.21.11'
          fetch-depth: 0

      - name: Migrate Carpet off bundled Fabric Loader API
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import shutil

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match for {old!r}, found {count}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches for {old!r}, found {count}")
              if count == 0:
                  raise SystemExit(f"{path}: no matches for {old!r}")
              p.write_text(text.replace(old, new))

          platform = r'''package carpet.neoforge;

          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.Collection;
          import java.util.Enumeration;
          import java.util.List;
          import java.util.Optional;
          import java.util.function.Predicate;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          import net.neoforged.api.distmarker.Dist;
          import net.neoforged.fml.ModList;
          import net.neoforged.fml.loading.FMLEnvironment;
          import net.neoforged.fml.loading.FMLPaths;

          /**
           * NeoForge-native platform services used by Carpet. This intentionally
           * lives in Carpet's own namespace: shipping fake net.fabricmc classes
           * breaks mods that carry or expect the real Fabric Loader ABI.
           */
          public final class CarpetPlatform {
              private static final String CARPET_MOD_ID = "carpet";
              private static final String MINECRAFT_MOD_ID = "minecraft";
              private static final String MINECRAFT_VERSION = "1.21.11";
              private static final String CARPET_BASE_VERSION = "1.4.194";
              private static final Pattern MOD_ID_LINE = Pattern.compile("(?m)^\\s*modId\\s*=\\s*\"([^\"]+)\"\\s*$");
              private static final Pattern MOD_VERSION_LINE = Pattern.compile("(?m)^\\s*version\\s*=\\s*\"([^\"]+)\"\\s*$");
              private static volatile String earlyCarpetVersion;

              private CarpetPlatform() {
              }

              public record ModInfo(String id, String version) {
              }

              public static boolean isClient() {
                  return FMLEnvironment.getDist() == Dist.CLIENT;
              }

              public static boolean isDevelopmentEnvironment() {
                  return !FMLEnvironment.isProduction();
              }

              public static Path getConfigDir() {
                  return FMLPaths.CONFIGDIR.get();
              }

              public static Path getGameDir() {
                  return FMLPaths.GAMEDIR.get();
              }

              public static Optional<ModInfo> getMod(String modId) {
                  try {
                      ModList list = ModList.get();
                      if (list != null) {
                          Optional<ModInfo> loaded = list.getMods().stream()
                                  .filter(info -> info.getModId().equals(modId))
                                  .findFirst()
                                  .map(info -> new ModInfo(info.getModId(), info.getVersion().toString()));
                          if (loaded.isPresent()) return loaded;
                      }
                  } catch (IllegalStateException ignored) {
                      // ModList can be unavailable during early bootstrap.
                  }

                  if (MINECRAFT_MOD_ID.equals(modId)) {
                      return Optional.of(new ModInfo(MINECRAFT_MOD_ID, MINECRAFT_VERSION));
                  }
                  if (CARPET_MOD_ID.equals(modId)) {
                      return Optional.of(new ModInfo(CARPET_MOD_ID, getEarlyCarpetVersion()));
                  }
                  return Optional.empty();
              }

              public static Collection<ModInfo> getAllMods() {
                  try {
                      ModList list = ModList.get();
                      if (list != null) {
                          return list.getMods().stream()
                                  .map(info -> new ModInfo(info.getModId(), info.getVersion().toString()))
                                  .toList();
                      }
                  } catch (IllegalStateException ignored) {
                  }
                  return List.of();
              }

              public static String getCarpetVersion() {
                  return getMod(CARPET_MOD_ID).map(ModInfo::version).orElse(CARPET_BASE_VERSION);
              }

              public static int[] getMinecraftReleaseTarget() {
                  try {
                      SemanticVersion version = SemanticVersion.parse(
                              getMod(MINECRAFT_MOD_ID).map(ModInfo::version).orElse(MINECRAFT_VERSION));
                      return new int[] { version.component(1), version.component(2) };
                  } catch (VersionParsingException ignored) {
                      return new int[] { 21, 11 };
                  }
              }

              public static boolean modVersionMatches(String modId, String expression) throws VersionParsingException {
                  VersionPredicate predicate = VersionPredicate.parse(expression);
                  Optional<ModInfo> mod = getMod(modId);
                  if (mod.isEmpty()) return false;

                  VersionValue present = VersionValue.parse(mod.get().version());
                  return predicate.test(present)
                          || (isDevelopmentEnvironment() && !(present instanceof SemanticVersion));
              }

              public static String[] getLaunchArguments(boolean sanitize) {
                  String command = System.getProperty("sun.java.command", "");
                  if (command.isBlank()) return new String[0];
                  List<String> tokens = tokenize(command);
                  if (!tokens.isEmpty()) tokens.remove(0);
                  if (sanitize) sanitize(tokens);
                  return tokens.toArray(String[]::new);
              }

              private static String getEarlyCarpetVersion() {
                  String cached = earlyCarpetVersion;
                  if (cached != null) return cached;
                  String resolved = readCarpetVersionFromMetadata().orElse(CARPET_BASE_VERSION);
                  earlyCarpetVersion = resolved;
                  return resolved;
              }

              private static Optional<String> readCarpetVersionFromMetadata() {
                  ClassLoader loader = CarpetPlatform.class.getClassLoader();
                  try {
                      Enumeration<URL> resources = loader.getResources("META-INF/neoforge.mods.toml");
                      while (resources.hasMoreElements()) {
                          URL resource = resources.nextElement();
                          try (InputStream input = resource.openStream();
                               BufferedReader reader = new BufferedReader(new InputStreamReader(input, StandardCharsets.UTF_8))) {
                              StringBuilder toml = new StringBuilder();
                              String line;
                              while ((line = reader.readLine()) != null) toml.append(line).append('\n');

                              String[] modSections = toml.toString().split("\\[\\[mods]]");
                              for (int i = 1; i < modSections.length; i++) {
                                  String section = modSections[i];
                                  int nextTable = section.indexOf("[[");
                                  if (nextTable >= 0) section = section.substring(0, nextTable);

                                  Matcher idMatcher = MOD_ID_LINE.matcher(section);
                                  if (!idMatcher.find() || !CARPET_MOD_ID.equals(idMatcher.group(1).trim())) continue;
                                  Matcher versionMatcher = MOD_VERSION_LINE.matcher(section);
                                  if (versionMatcher.find()) {
                                      String version = versionMatcher.group(1).trim();
                                      if (!version.isEmpty() && !version.contains("${")) return Optional.of(version);
                                  }
                              }
                          }
                      }
                  } catch (IOException ignored) {
                  }
                  return Optional.empty();
              }

              private static List<String> tokenize(String value) {
                  List<String> result = new ArrayList<>();
                  StringBuilder current = new StringBuilder();
                  boolean quoted = false;
                  char quote = 0;
                  boolean escaped = false;
                  for (int i = 0; i < value.length(); i++) {
                      char c = value.charAt(i);
                      if (escaped) {
                          current.append(c);
                          escaped = false;
                      } else if (c == '\\') {
                          escaped = true;
                      } else if (quoted) {
                          if (c == quote) quoted = false;
                          else current.append(c);
                      } else if (c == '\'' || c == '"') {
                          quoted = true;
                          quote = c;
                      } else if (Character.isWhitespace(c)) {
                          if (!current.isEmpty()) {
                              result.add(current.toString());
                              current.setLength(0);
                          }
                      } else {
                          current.append(c);
                      }
                  }
                  if (!current.isEmpty()) result.add(current.toString());
                  return result;
              }

              private static void sanitize(List<String> args) {
                  for (int i = 0; i < args.size(); i++) {
                      String arg = args.get(i);
                      if (arg.equals("--accessToken") || arg.equals("--clientId") || arg.equals("--uuid") || arg.equals("--xuid")) {
                          if (i + 1 < args.size()) args.set(++i, "<redacted>");
                      }
                  }
              }

              public static final class VersionParsingException extends Exception {
                  public VersionParsingException(String message) {
                      super(message);
                  }

                  public VersionParsingException(String message, Throwable cause) {
                      super(message, cause);
                  }
              }

              private interface VersionValue extends Comparable<VersionValue> {
                  String friendlyString();

                  static VersionValue parse(String value) throws VersionParsingException {
                      try {
                          return SemanticVersion.parse(value);
                      } catch (VersionParsingException ignored) {
                          if (value == null || value.isBlank()) {
                              throw new VersionParsingException("Version cannot be blank");
                          }
                          return new StringVersion(value);
                      }
                  }
              }

              private record StringVersion(String value) implements VersionValue {
                  @Override
                  public String friendlyString() {
                      return value;
                  }

                  @Override
                  public int compareTo(VersionValue other) {
                      return value.compareToIgnoreCase(other.friendlyString());
                  }
              }

              private static final class SemanticVersion implements VersionValue {
                  private static final int WILDCARD = Integer.MIN_VALUE;
                  private final String original;
                  private final int[] components;
                  private final String prerelease;
                  private final boolean wildcard;

                  private SemanticVersion(String original, int[] components, String prerelease, boolean wildcard) {
                      this.original = original;
                      this.components = components;
                      this.prerelease = prerelease;
                      this.wildcard = wildcard;
                  }

                  static SemanticVersion parse(String value) throws VersionParsingException {
                      if (value == null || value.isBlank()) throw new VersionParsingException("Version cannot be blank");
                      String original = value.trim();
                      String core = original;
                      String prerelease = null;
                      int plus = core.indexOf('+');
                      if (plus >= 0) core = core.substring(0, plus);
                      int dash = core.indexOf('-');
                      if (dash >= 0) {
                          prerelease = core.substring(dash + 1);
                          core = core.substring(0, dash);
                      }
                      if (core.isBlank()) throw new VersionParsingException("Missing semantic version core: " + value);

                      String[] pieces = core.split("\\.");
                      int[] components = new int[pieces.length];
                      boolean wildcard = false;
                      for (int i = 0; i < pieces.length; i++) {
                          String piece = pieces[i];
                          if (piece.equals("x") || piece.equals("X") || piece.equals("*")) {
                              components[i] = WILDCARD;
                              wildcard = true;
                          } else {
                              try {
                                  components[i] = Integer.parseInt(piece);
                              } catch (NumberFormatException e) {
                                  throw new VersionParsingException("Invalid semantic version component '" + piece + "' in " + value, e);
                              }
                          }
                      }
                      return new SemanticVersion(original, components, prerelease, wildcard);
                  }

                  int componentCount() {
                      return components.length;
                  }

                  int component(int pos) {
                      if (pos < components.length) return components[pos];
                      return wildcard ? WILDCARD : 0;
                  }

                  @Override
                  public String friendlyString() {
                      return original;
                  }

                  @Override
                  public int compareTo(VersionValue other) {
                      if (!(other instanceof SemanticVersion semantic)) {
                          return original.compareToIgnoreCase(other.friendlyString());
                      }
                      int count = Math.max(componentCount(), semantic.componentCount());
                      for (int i = 0; i < count; i++) {
                          int left = component(i) == WILDCARD ? 0 : component(i);
                          int right = semantic.component(i) == WILDCARD ? 0 : semantic.component(i);
                          int cmp = Integer.compare(left, right);
                          if (cmp != 0) return cmp;
                      }
                      if (prerelease == null && semantic.prerelease == null) return 0;
                      if (prerelease == null) return 1;
                      if (semantic.prerelease == null) return -1;
                      return comparePrerelease(prerelease, semantic.prerelease);
                  }

                  private static int comparePrerelease(String left, String right) {
                      String[] l = left.split("\\.");
                      String[] r = right.split("\\.");
                      for (int i = 0; i < Math.max(l.length, r.length); i++) {
                          if (i >= l.length) return -1;
                          if (i >= r.length) return 1;
                          String a = l[i];
                          String b = r[i];
                          boolean aNumeric = a.chars().allMatch(Character::isDigit);
                          boolean bNumeric = b.chars().allMatch(Character::isDigit);
                          int cmp;
                          if (aNumeric && bNumeric) cmp = Integer.compare(Integer.parseInt(a), Integer.parseInt(b));
                          else if (aNumeric != bNumeric) cmp = aNumeric ? -1 : 1;
                          else cmp = a.compareToIgnoreCase(b);
                          if (cmp != 0) return cmp;
                      }
                      return 0;
                  }
              }

              private static final class VersionPredicate implements Predicate<VersionValue> {
                  private final List<List<Predicate<VersionValue>>> alternatives;

                  private VersionPredicate(List<List<Predicate<VersionValue>>> alternatives) {
                      this.alternatives = alternatives;
                  }

                  static VersionPredicate parse(String expression) throws VersionParsingException {
                      if (expression == null || expression.isBlank() || expression.trim().equals("*")) {
                          return new VersionPredicate(List.of(List.of(version -> true)));
                      }
                      List<List<Predicate<VersionValue>>> alternatives = new ArrayList<>();
                      for (String alternative : expression.split("\\|\\|")) {
                          String normalized = alternative.trim().replace(',', ' ');
                          if (normalized.isEmpty()) continue;
                          List<Predicate<VersionValue>> terms = new ArrayList<>();
                          for (String token : normalized.split("\\s+")) {
                              if (!token.isBlank()) terms.add(parseTerm(token));
                          }
                          if (!terms.isEmpty()) alternatives.add(terms);
                      }
                      if (alternatives.isEmpty()) throw new VersionParsingException("Invalid version predicate: " + expression);
                      return new VersionPredicate(alternatives);
                  }

                  private static Predicate<VersionValue> parseTerm(String token) throws VersionParsingException {
                      if (token.equals("*")) return version -> true;
                      String operator = "=";
                      String raw = token;
                      for (String candidate : List.of(">=", "<=", "==", ">", "<", "~", "^", "=")) {
                          if (token.startsWith(candidate)) {
                              operator = candidate;
                              raw = token.substring(candidate.length());
                              break;
                          }
                      }
                      if (raw.isBlank()) throw new VersionParsingException("Missing version in predicate term: " + token);
                      if (raw.contains("*") || raw.contains("x") || raw.contains("X")) {
                          SemanticVersion pattern = SemanticVersion.parse(raw);
                          return version -> wildcardMatches(version, pattern);
                      }
                      SemanticVersion target = SemanticVersion.parse(raw);
                      return switch (operator) {
                          case ">=" -> version -> version.compareTo(target) >= 0;
                          case "<=" -> version -> version.compareTo(target) <= 0;
                          case ">" -> version -> version.compareTo(target) > 0;
                          case "<" -> version -> version.compareTo(target) < 0;
                          case "~" -> bounded(target, tildeUpperBound(target));
                          case "^" -> bounded(target, caretUpperBound(target));
                          case "=", "==" -> version -> version.compareTo(target) == 0;
                          default -> throw new VersionParsingException("Unsupported version predicate operator: " + operator);
                      };
                  }

                  private static Predicate<VersionValue> bounded(SemanticVersion lower, SemanticVersion upper) {
                      return version -> version.compareTo(lower) >= 0 && version.compareTo(upper) < 0;
                  }

                  private static SemanticVersion tildeUpperBound(SemanticVersion target) throws VersionParsingException {
                      int major = target.component(0);
                      int minor = target.componentCount() > 1 ? target.component(1) : 0;
                      if (target.componentCount() <= 1) return SemanticVersion.parse((major + 1) + ".0.0");
                      return SemanticVersion.parse(major + "." + (minor + 1) + ".0");
                  }

                  private static SemanticVersion caretUpperBound(SemanticVersion target) throws VersionParsingException {
                      int major = target.component(0);
                      int minor = target.componentCount() > 1 ? target.component(1) : 0;
                      int patch = target.componentCount() > 2 ? target.component(2) : 0;
                      if (major > 0) return SemanticVersion.parse((major + 1) + ".0.0");
                      if (minor > 0) return SemanticVersion.parse("0." + (minor + 1) + ".0");
                      return SemanticVersion.parse("0.0." + (patch + 1));
                  }

                  private static boolean wildcardMatches(VersionValue version, SemanticVersion pattern) {
                      if (!(version instanceof SemanticVersion semantic)) return false;
                      for (int i = 0; i < pattern.componentCount(); i++) {
                          int expected = pattern.component(i);
                          if (expected == SemanticVersion.WILDCARD) return true;
                          if (semantic.component(i) != expected) return false;
                      }
                      return true;
                  }

                  @Override
                  public boolean test(VersionValue version) {
                      for (List<Predicate<VersionValue>> alternative : alternatives) {
                          boolean matches = true;
                          for (Predicate<VersionValue> predicate : alternative) {
                              if (!predicate.test(version)) {
                                  matches = false;
                                  break;
                              }
                          }
                          if (matches) return true;
                      }
                      return false;
                  }
              }
          }
          '''
          Path('src/main/java/carpet/neoforge/CarpetPlatform.java').write_text(platform)

          replace_once('src/main/java/carpet/CarpetSettings.java',
                       'import net.fabricmc.loader.api.FabricLoader;\nimport net.fabricmc.loader.api.SemanticVersion;\n',
                       'import carpet.neoforge.CarpetPlatform;\n')
          replace_once('src/main/java/carpet/CarpetSettings.java',
                       '    public static final String carpetVersion = FabricLoader.getInstance().getModContainer("carpet").orElseThrow().getMetadata().getVersion().toString();\n    public static final int [] releaseTarget =  {\n            ((SemanticVersion)FabricLoader.getInstance().getModContainer("minecraft").orElseThrow().getMetadata().getVersion()).getVersionComponent(1),\n            ((SemanticVersion)FabricLoader.getInstance().getModContainer("minecraft").orElseThrow().getMetadata().getVersion()).getVersionComponent(2)\n    };\n',
                       '    public static final String carpetVersion = CarpetPlatform.getCarpetVersion();\n    public static final int[] releaseTarget = CarpetPlatform.getMinecraftReleaseTarget();\n')

          replace_once('src/main/java/carpet/CarpetServer.java',
                       'import net.fabricmc.loader.api.FabricLoader;\n',
                       'import carpet.neoforge.CarpetPlatform;\n')
          replace_once('src/main/java/carpet/CarpetServer.java',
                       'if (FabricLoader.getInstance().isDevelopmentEnvironment())',
                       'if (CarpetPlatform.isDevelopmentEnvironment())')
          replace_once('src/main/java/carpet/CarpetServer.java',
                       '     * Should be called before Carpet\'s startup, like in Fabric Loader\'s\n     * {@link net.fabricmc.api.ModInitializer} entrypoint\n',
                       '     * Should be called before Carpet\'s startup from the loader\'s normal mod initialization entrypoint.\n')
          replace_once('src/main/java/carpet/CarpetServer.java',
                       '    // Gets called by Fabric Loader from a ServerModInitializer and a ClientModInitializer, in both to allow extensions \n    // to register before this call in a ModInitializer (declared in fabric.mod.json)\n',
                       '    // NeoForge calls this after mod construction so extensions can register before Carpet finalizes startup.\n')

          replace_once('src/main/java/carpet/api/settings/SettingsManager.java',
                       'import net.fabricmc.api.EnvType;\nimport net.fabricmc.loader.api.FabricLoader;\n',
                       'import carpet.neoforge.CarpetPlatform;\n')
          replace_all('src/main/java/carpet/api/settings/SettingsManager.java',
                      'FabricLoader.getInstance().getEnvironmentType() == EnvType.CLIENT',
                      'CarpetPlatform.isClient()', expected=1)
          replace_all('src/main/java/carpet/api/settings/SettingsManager.java',
                      'FabricLoader.getInstance().getConfigDir()',
                      'CarpetPlatform.getConfigDir()', expected=1)

          replace_once('src/main/java/carpet/script/external/Carpet.java',
                       'import net.fabricmc.api.EnvType;\nimport net.fabricmc.loader.api.FabricLoader;\nimport net.fabricmc.loader.api.ModContainer;\nimport net.fabricmc.loader.api.SemanticVersion;\nimport net.fabricmc.loader.api.Version;\nimport net.fabricmc.loader.api.VersionParsingException;\nimport net.fabricmc.loader.api.metadata.version.VersionPredicate;\n',
                       'import carpet.neoforge.CarpetPlatform;\n')
          replace_all('src/main/java/carpet/script/external/Carpet.java',
                      'FabricLoader.getInstance().getEnvironmentType() == EnvType.CLIENT',
                      'CarpetPlatform.isClient()', expected=2)
          replace_all('src/main/java/carpet/script/external/Carpet.java',
                      'FabricLoader.getInstance().getConfigDir()',
                      'CarpetPlatform.getConfigDir()', expected=2)
          p = Path('src/main/java/carpet/script/external/Carpet.java')
          text = p.read_text()
          start = text.index('    public static void assertRequirementMet(CarpetScriptHost host, String requiredModId, String stringPredicate)\n')
          end = text.index('    // to be ran once during CarpetEventServer.Event static init\n', start)
          replacement = '''    public static void assertRequirementMet(CarpetScriptHost host, String requiredModId, String stringPredicate)\n    {\n        try\n        {\n            if (CarpetPlatform.modVersionMatches(requiredModId, stringPredicate))\n            {\n                return;\n            }\n        }\n        catch (CarpetPlatform.VersionParsingException e)\n        {\n            throw new InternalExpressionException("Failed to parse version conditions for '" + requiredModId + "' in 'requires': " + e.getMessage());\n        }\n        throw new LoadException(String.format("%s requires a version of mod '%s' matching '%s', which is missing!", host.getVisualName(), requiredModId, stringPredicate));\n    }\n\n'''
          p.write_text(text[:start] + replacement + text[end:])

          replace_once('src/main/java/carpet/script/external/Vanilla.java',
                       'import net.fabricmc.loader.api.FabricLoader;\nimport net.fabricmc.loader.api.ModContainer;\n',
                       'import carpet.neoforge.CarpetPlatform;\n')
          replace_once('src/main/java/carpet/script/external/Vanilla.java',
                       '        return FabricLoader.getInstance().isDevelopmentEnvironment();',
                       '        return CarpetPlatform.isDevelopmentEnvironment();')
          replace_once('src/main/java/carpet/script/external/Vanilla.java',
                       '        for (ModContainer mod : FabricLoader.getInstance().getAllMods())\n        {\n            ret.put(new StringValue(mod.getMetadata().getId()), new StringValue(mod.getMetadata().getVersion().getFriendlyString()));\n        }',
                       '        for (CarpetPlatform.ModInfo mod : CarpetPlatform.getAllMods())\n        {\n            ret.put(new StringValue(mod.id()), new StringValue(mod.version()));\n        }')

          replace_once('src/main/java/carpet/utils/CarpetRulePrinter.java',
                       'import net.fabricmc.api.DedicatedServerModInitializer;\nimport net.fabricmc.loader.api.FabricLoader;\n',
                       'import carpet.neoforge.CarpetPlatform;\n')
          replace_once('src/main/java/carpet/utils/CarpetRulePrinter.java',
                       'public class CarpetRulePrinter implements DedicatedServerModInitializer {',
                       'public class CarpetRulePrinter {')
          replace_once('src/main/java/carpet/utils/CarpetRulePrinter.java', '    @Override\n    public void onInitializeServer() {', '    public void onInitializeServer() {')
          replace_once('src/main/java/carpet/utils/CarpetRulePrinter.java',
                       'FabricLoader.getInstance().getLaunchArguments(true)',
                       'CarpetPlatform.getLaunchArguments(true)')

          shim = Path('src/main/java/net/fabricmc')
          if not shim.exists():
              raise SystemExit('Expected bundled net/fabricmc compatibility shim is missing')
          shutil.rmtree(shim)

          workflow = Path('.github/workflows/devbuild.yml')
          wf = workflow.read_text()
          marker = '      - name: Production server JAR, fake-player, and Scarpet smoke test\n'
          if wf.count(marker) != 1:
              raise SystemExit('Could not locate production server smoke-test marker')
          verify = '''      - name: Verify Fabric Loader API is not bundled\n        shell: bash\n        run: |\n          set -euo pipefail\n          jar_file="$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"\n          if jar tf "$jar_file" | grep -Eq '^net/fabricmc/(api|loader)/'; then\n            echo 'Carpet must not ship classes in the Fabric Loader/API namespace.' >&2\n            jar tf "$jar_file" | grep -E '^net/fabricmc/(api|loader)/' >&2\n            exit 1\n          fi\n\n'''
          workflow.write_text(wf.replace(marker, verify + marker, 1))

          bad_imports = []
          for java in Path('src/main/java').rglob('*.java'):
              for line_no, line in enumerate(java.read_text().splitlines(), 1):
                  if line.startswith('import net.fabricmc.'):
                      bad_imports.append(f'{java}:{line_no}:{line}')
          if bad_imports:
              raise SystemExit('Remaining Fabric imports:\n' + '\n'.join(bad_imports))
          PY

          rm -f .github/workflows/remove-fabric-shim.yml
          git add -A
          git diff --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove bundled Fabric Loader compatibility classes'
          git push origin HEAD:1.21.11
