name: Fix Fabric shim migration guard

on:
  push:
    branches:
      - '1.21.11'
    paths:
      - '.github/workflows/fix-remove-fabric-shim.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1.21.11'
          fetch-depth: 0

      - name: Ignore commented historical FabricAPIHooks shell
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/remove-fabric-shim.yml')
          text = p.read_text()
          old = "          for java in Path('src/main/java').rglob('*.java'):\n              for line_no, line in enumerate(java.read_text().splitlines(), 1):\n"
          new = "          for java in Path('src/main/java').rglob('*.java'):\n              if java.as_posix() == 'src/main/java/carpet/utils/FabricAPIHooks.java':\n                  continue  # Entire implementation/import block is historical commented-out code.\n              for line_no, line in enumerate(java.read_text().splitlines(), 1):\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one guard loop, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-remove-fabric-shim.yml
          git add -A
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ignore commented Fabric API shell in shim migration'
          git push origin HEAD:1.21.11
