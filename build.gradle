plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

def carpetBuildVersion = project.mod_version + '+v' + new Date().format('yyMMdd')
version = project.minecraft_version + '-' + carpetBuildVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        carpet {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    inputs.property 'version', carpetBuildVersion
    inputs.property 'neo_version', project.neo_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': carpetBuildVersion, 'neo_version': project.neo_version
    }
}

def intermediaryNamePattern = ~/\b(?:class|method|field)_\d+\b/

def stripJavaComments = { String source ->
    def out = new StringBuilder(source.length())
    boolean inLineComment = false
    boolean inBlockComment = false
    boolean inString = false
    boolean inChar = false
    boolean escaped = false

    for (int i = 0; i < source.length(); i++) {
        def current = source.charAt(i)
        def next = i + 1 < source.length() ? source.charAt(i + 1) : null

        if (inLineComment) {
            if (current == '\n') {
                inLineComment = false
                out.append(current)
            } else {
                out.append(' ')
            }
            continue
        }

        if (inBlockComment) {
            if (current == '*' && next == '/') {
                out.append(' ')
                out.append(' ')
                i++
                inBlockComment = false
            } else if (current == '\n') {
                out.append(current)
            } else {
                out.append(' ')
            }
            continue
        }

        if (inString) {
            out.append(current)
            if (escaped) {
                escaped = false
            } else if (current == '\\') {
                escaped = true
            } else if (current == '"') {
                inString = false
            }
            continue
        }

        if (inChar) {
            out.append(current)
            if (escaped) {
                escaped = false
            } else if (current == '\\') {
                escaped = true
            } else if (current == '\'') {
                inChar = false
            }
            continue
        }

        if (current == '/' && next == '/') {
            out.append(' ')
            out.append(' ')
            i++
            inLineComment = true
            continue
        }
        if (current == '/' && next == '*') {
            out.append(' ')
            out.append(' ')
            i++
            inBlockComment = true
            continue
        }

        out.append(current)
        if (current == '"') {
            inString = true
        } else if (current == '\'') {
            inChar = true
        }
    }

    out.toString()
}

tasks.register('checkForIntermediaryNames') {
    group = 'verification'
    description = 'Rejects Yarn intermediary names that are invalid in production Mojang mappings.'
    inputs.files(fileTree('src/main/java') {
        include '**/*.java'
    })

    doLast {
        def offenders = []
        inputs.files.files.sort { it.path }.each { file ->
            def uncommentedSource = stripJavaComments(file.getText('UTF-8'))
            uncommentedSource.readLines().eachWithIndex { line, index ->
                def matcher = line =~ intermediaryNamePattern
                if (matcher.find()) {
                    offenders << "${project.relativePath(file)}:${index + 1}: ${matcher.group()}"
                }
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                'Yarn intermediary names found in Java sources; use Mojang-mapped names instead:\n' +
                    offenders.join('\n')
            )
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkForIntermediaryNames')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "$projectDir/publish"
        }
    }
}


tasks.register('checkNoBundledFabricNamespaces') {
    group = 'verification'
    description = 'Fails if the NeoForge port ships compatibility classes in Fabric API/Loader namespaces.'
    doLast {
        def forbidden = [
                file('src/main/java/net/fabricmc/api'),
                file('src/main/java/net/fabricmc/loader')
        ].findAll { it.exists() }
        if (!forbidden.isEmpty()) {
            throw new GradleException('NeoForge Carpet must not bundle net.fabricmc API/Loader classes: ' + forbidden)
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkNoBundledFabricNamespaces')
}
