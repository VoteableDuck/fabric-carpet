plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

def carpetBuildVersion = project.mod_version + '+v' + new Date().format('yyMMdd')
version = project.minecraft_version + '-' + carpetBuildVersion
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        carpet {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    inputs.property 'version', carpetBuildVersion
    inputs.property 'neo_version', project.neo_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': carpetBuildVersion, 'neo_version': project.neo_version
    }
}

def intermediaryNamePattern = ~/\b(?:class|method|field)_\d+\b/

tasks.register('checkForIntermediaryNames') {
    group = 'verification'
    description = 'Rejects Yarn intermediary names that are invalid in production Mojang mappings.'
    inputs.files(fileTree('src/main/java') {
        include '**/*.java'
    })

    doLast {
        def offenders = []
        inputs.files.files.sort { it.path }.each { file ->
            file.eachLine('UTF-8') { line, lineNumber ->
                def matcher = line =~ intermediaryNamePattern
                if (matcher.find()) {
                    offenders << "${project.relativePath(file)}:${lineNumber}: ${matcher.group()}"
                }
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                'Yarn intermediary names found in Java sources; use Mojang-mapped names instead:\n' +
                    offenders.join('\n')
            )
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkForIntermediaryNames')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "$projectDir/publish"
        }
    }
}
